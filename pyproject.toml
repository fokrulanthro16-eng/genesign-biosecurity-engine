[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genesign"
version = "2.0.0"
description = "Commercial Synthetic DNA Watermarking, Origin Provenance & Biosecurity Firewall Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "cryptography>=43.0.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "pytest>=8.0.0",
    "reportlab>=4.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0"
]

[project.scripts]
genesign = "cli:cli"
